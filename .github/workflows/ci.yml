name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # ffmpeg real para os testes de áudio (peaks, loudnorm, mixdown).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # Nunca instalar o grupo `pipeline` (torch/demucs) no CI.
      - run: uv sync --locked --group api --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest
      - name: Smoke das migrations
        run: uv run alembic upgrade head
        env:
          STORAGE_ROOT: ${{ runner.temp }}/stemma-data
      - name: Drift do OpenAPI (rode `npm run gen:api` no frontend)
        run: |
          uv run python -m app.openapi ../frontend/src/api/openapi.json
          git diff --exit-code -- ../frontend/src/api/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Drift dos tipos da API (rode `npm run gen:api`)
        run: |
          npm run gen:api:types
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm test
      - run: npm run build

  # O instalador só é compilado quando algo dele muda (deploy/, installer/, empacotamento).
  changes:
    runs-on: ubuntu-latest
    outputs:
      installer: ${{ steps.filter.outputs.installer }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            installer:
              - 'deploy/**'
              - 'installer/**'
              - 'scripts/package.sh'
              - '.github/workflows/**'

  # Windows PowerShell 5.1 de verdade (junction, hardlink, serviço) + build do instalador.
  installer:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pester no Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.5' })) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
            Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -MinimumVersion 5.5
          $config = New-PesterConfiguration
          $config.Run.Path = 'deploy/tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build do frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Pacote de teste
        shell: bash
        run: bash scripts/package.sh v0.0.0 build
      - name: Inno Setup
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Compilar o instalador
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer\build.ps1 -ZipPath build\stemma-v0.0.0.zip

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            build
            ci
            revert
