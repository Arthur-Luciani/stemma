name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # Nunca instalar o grupo `pipeline` (torch/demucs) no CI.
      - run: uv sync --locked --group api --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest
      - name: Smoke das migrations
        run: uv run alembic upgrade head
        env:
          STORAGE_ROOT: ${{ runner.temp }}/stemma-data
      - name: Drift do OpenAPI (rode `npm run gen:api` no frontend)
        run: |
          uv run python -m app.openapi ../frontend/src/api/openapi.json
          git diff --exit-code -- ../frontend/src/api/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Drift dos tipos da API (rode `npm run gen:api`)
        run: |
          npm run gen:api:types
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm test
      - run: npm run build

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            build
            ci
            revert
