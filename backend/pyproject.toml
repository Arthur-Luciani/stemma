[project]
name = "stemma"
version = "1.0.0"
description = "Separa músicas em stems (voz, bateria, baixo, outros) e oferece um mixer por stem."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "yt-dlp[default]>=2025.1.1",
]
pipeline = [
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "demucs==4.0.1",
    "soundfile>=0.12",
]
dev = [
    "pytest>=8.3",
    "httpx2>=2.13",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# O app só roda no Windows (produção) e no Linux (CI).
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "T20", "DTZ", "PTH", "N"]
# Travessão (–) é a grafia correta em PT-BR para intervalos como "loop A–B" e "0–100".
allowed-confusables = ["–"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# yt-dlp não publica tipos.
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
