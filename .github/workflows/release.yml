name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Fica neste workflow porque eventos criados com GITHUB_TOKEN não disparam outros workflows.
  package:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build do frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Montar pacote
        run: bash scripts/package.sh "$TAG" .
      - name: Anexar à release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "stemma-${TAG}.zip" "stemma-${TAG}.zip.sha256" --clobber

  # Instalador do Windows (Inno Setup) com o zip da própria release dentro (ADR 0014).
  installer:
    needs: [release-please, package]
    runs-on: windows-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Baixar o pacote da release
        shell: bash
        run: |
          mkdir -p build
          gh release download "$TAG" --dir build --pattern "stemma-${TAG}.zip" --pattern "stemma-${TAG}.zip.sha256"
      - name: Inno Setup
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Compilar o instalador
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer\build.ps1 -ZipPath "build\stemma-$env:TAG.zip"
      - name: Anexar à release
        shell: bash
        run: gh release upload "$TAG" "build/Stemma-Setup-${TAG}.exe" "build/Stemma-Setup-${TAG}.exe.sha256" --clobber
